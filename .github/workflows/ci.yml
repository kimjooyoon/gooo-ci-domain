name: CI domain
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: domain-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  domain:
    name: Domain checks (180 seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GOTOOLCHAIN: go1.27.2
      GOWORK: off
      GOMAXPROCS: 2
    steps:
      - name: Bind original run and admitted work clocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          admitted_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$admitted_started_at" > "$RUNNER_TEMP/work-started-at.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/workflow-run.json"
          jq -e --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '(.id | tostring) == $run and (.run_attempt | tostring) == $attempt and
             (.created_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' \
            "$RUNNER_TEMP/workflow-run.json" > /dev/null
          workflow_created_at="$(jq -r .created_at "$RUNNER_TEMP/workflow-run.json")"
          admitted_seconds="$(date -d "$admitted_started_at" +%s)"
          created_seconds="$(date -d "$workflow_created_at" +%s)"
          elapsed_before_admission=$((admitted_seconds - created_seconds))
          test "$elapsed_before_admission" -ge 0
          {
            printf 'CI_SCOPE_STARTED_AT=%s\n' "$admitted_started_at"
            printf 'CI_WORKFLOW_CREATED_AT=%s\n' "$workflow_created_at"
          } >> "$GITHUB_ENV"
          printf 'Elapsed before work admission: %s seconds. Admitted work budget: 180 seconds.\n' \
            "$elapsed_before_admission" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify source projections and domain behavior
        run: |
          test "$(go env GOVERSION)" = "go1.27.2"
          unformatted="$(gofmt -l .)"
          if test -n "$unformatted"; then
            printf '%s\n' "$unformatted" >&2
            gofmt -d .
            exit 1
          fi
          remaining=$((180 - ($(date +%s) - $(date -d "$CI_SCOPE_STARTED_AT" +%s))))
          test "$remaining" -gt 0
          timeout --signal=KILL "${remaining}s" go build -p=1 -o "$RUNNER_TEMP/gooo-ci-domain" ./cmd/gooo-ci-domain
          "$RUNNER_TEMP/gooo-ci-domain" work \
            --root "$GITHUB_WORKSPACE" --head HEAD \
            --unit urn:gooo:ci-domain:domain-conformance \
            --journal "$RUNNER_TEMP/command-origins.jsonl" \
            --started-at "$CI_SCOPE_STARTED_AT" --budget-ms 180000 \
            -- go test -race -mod=readonly -p=1 -count=1 -timeout=180s ./... \
            > "$RUNNER_TEMP/domain-work-receipt.json"
      - name: Preserve this original command origin
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: command-origins-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/command-origins.jsonl
            ${{ runner.temp }}/domain-work-receipt.json
            ${{ runner.temp }}/workflow-run.json
            ${{ runner.temp }}/work-started-at.txt
          if-no-files-found: warn
          retention-days: 14
