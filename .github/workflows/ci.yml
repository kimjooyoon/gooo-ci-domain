name: CI domain
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: domain-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  domain:
    name: Domain checks (180 seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GOTOOLCHAIN: go1.27.2
      GOWORK: off
      GOMAXPROCS: 2
    steps:
      - name: Bind the original run clock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          printf 'CI_SCOPE_STARTED_AT=%s\n' "$run_started_at" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify source projections and domain behavior
        run: |
          test "$(go env GOVERSION)" = "go1.27.2"
          test -z "$(gofmt -l .)"
          remaining=$((180 - ($(date +%s) - $(date -d "$CI_SCOPE_STARTED_AT" +%s))))
          test "$remaining" -gt 0
          timeout --signal=KILL "${remaining}s" go build -p=1 -o "$RUNNER_TEMP/gooo-ci-domain" ./cmd/gooo-ci-domain
          "$RUNNER_TEMP/gooo-ci-domain" work \
            --root "$GITHUB_WORKSPACE" --head HEAD \
            --unit urn:gooo:ci-domain:domain-conformance \
            --journal "$RUNNER_TEMP/command-origins.jsonl" \
            --started-at "$CI_SCOPE_STARTED_AT" --budget-ms 180000 \
            -- go test -race -mod=readonly -p=1 -count=1 -timeout=180s ./... \
            > "$RUNNER_TEMP/domain-work-receipt.json"
      - name: Preserve this original command origin
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: command-origins-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/command-origins.jsonl
            ${{ runner.temp }}/domain-work-receipt.json
          if-no-files-found: warn
          retention-days: 14
